[project]
name = "variant-browser"
version = "0.1.0"
description = "Local web app for browsing tumour variants across samples and along each patient's treatment timeline"
requires-python = ">=3.12"
dependencies = [
    "dash>=3,<4",
    "plotly>=6,<7",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
variant-browser = "variant_browser.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
